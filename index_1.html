<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>O Caso da Foto no Grupo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: tela cheia de jogo (canvas) com interface sobreposta; visual único "pátio de escola + quadro-verde + caderno pautado" */
:root {
  --quadro: #24493b;
  --quadro-2: #1b382d;
  --giz: #f5f2e6;
  --sol: #ffc93c;
  --sol-escuro: #e0a915;
  --tijolo: #b9553c;
  --tinta: #1f2a44;
  --tinta-suave: #55607a;
  --papel: #fffdf6;
  --pauta: #c6dbef;
  --margem: #e27070;
  --ok: #2f9e62;
  --nao: #d24a4a;
  --sombra: rgba(20, 28, 45, .28);
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-texto: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: #6fa552; color: var(--tinta);
  font-family: var(--f-texto); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
#jogo { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }

/* barra superior */
.topo {
  position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px);
  display: flex; gap: 8px; align-items: flex-start; justify-content: space-between;
  padding: 10px 16px; pointer-events: none; z-index: 5;
}
.objetivo {
  pointer-events: auto; background: var(--quadro); color: var(--giz);
  border: 3px solid #8a6a3f; border-radius: 10px; padding: 7px 12px; max-width: min(520px, 62vw);
  box-shadow: 0 4px 0 var(--sombra); min-width: 0;
}
.objetivo small { display: block; font-family: var(--f-display); font-weight: 600; color: var(--sol); letter-spacing: .06em; text-transform: uppercase; font-size: 12px; }
.objetivo span { font-size: 15px; }
.acoes-topo { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; justify-content: flex-end; }
.btn-topo {
  background: var(--papel); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 10px;
  padding: 7px 12px; font-family: var(--f-display); font-weight: 600; font-size: 15px; box-shadow: 0 3px 0 var(--tinta);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn-topo:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }
.btn-topo .num { background: var(--sol); border-radius: 6px; padding: 0 6px; font-variant-numeric: tabular-nums; }

/* avisos */
.avisos { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); display: grid; gap: 6px; z-index: 30; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.aviso { background: var(--tinta); color: #fff; padding: 9px 14px; border-radius: 10px; font-family: var(--f-display); font-weight: 600; text-align: center; box-shadow: 0 4px 0 var(--sombra); animation: entra .25s ease-out; }
.aviso.pista { background: var(--ok); }
.aviso.erro { background: var(--nao); }
@keyframes entra { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* botão de interação */
.interagir {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translateX(-50%);
  background: var(--sol); color: var(--tinta); border: 3px solid var(--tinta); border-radius: 999px;
  padding: 10px 20px; font-family: var(--f-display); font-weight: 700; font-size: 18px; box-shadow: 0 4px 0 var(--tinta); z-index: 6;
  max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.interagir kbd { background: var(--papel); border: 2px solid var(--tinta); border-radius: 6px; padding: 0 6px; margin-right: 6px; font-family: var(--f-display); }
.toque .interagir { left: auto; right: 16px; transform: none; bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); padding: 16px 22px; }
.toque .interagir kbd { display: none; }

/* joystick */
.joy { position: fixed; width: 120px; height: 120px; border-radius: 50%; background: rgba(31,42,68,.18); border: 3px solid rgba(31,42,68,.35); z-index: 4; pointer-events: none; transform: translate(-50%, -50%); }
.joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--papel); border: 3px solid var(--tinta); }
.dica-toque { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); background: rgba(255,253,246,.85); border-radius: 10px; padding: 6px 10px; font-size: 13px; z-index: 4; pointer-events: none; }

/* caixa de diálogo: quadro-verde */
.dialogo {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  width: min(760px, calc(100% - 32px)); background: var(--quadro); color: var(--giz);
  border: 6px solid #8a6a3f; border-radius: 14px; padding: 14px 18px 16px; z-index: 10;
  box-shadow: 0 8px 0 var(--sombra), inset 0 0 40px rgba(0,0,0,.25);
}
.dialogo .quem { font-family: var(--f-display); font-weight: 700; font-size: 21px; color: var(--sol); }
.dialogo .quem small { font-family: var(--f-texto); font-weight: 400; color: #bcd3c6; font-size: 14px; margin-left: 8px; }
.dialogo .fala { font-size: 19px; min-height: 3.2em; margin-top: 4px; }
.dialogo .seguir { display: flex; justify-content: flex-end; margin-top: 6px; }
.btn-giz { background: transparent; color: var(--giz); border: 2px dashed rgba(245,242,230,.7); border-radius: 10px; padding: 6px 14px; font-family: var(--f-display); font-weight: 600; font-size: 16px; }
.escolhas { display: grid; gap: 8px; margin-top: 10px; }
.escolha { text-align: left; background: var(--papel); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 10px; padding: 10px 14px; font-size: 16px; box-shadow: 0 3px 0 var(--tinta); }
.escolha:hover { background: #fff3c9; }
.escolha:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }

/* janelas */
.fundo-modal { position: fixed; inset: 0; background: rgba(20,28,45,.55); z-index: 20; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.folha {
  width: min(720px, 100%); max-height: calc(100% - 8px); overflow-y: auto; background: var(--papel);
  border-radius: 14px; box-shadow: 0 10px 0 var(--sombra); position: relative; min-width: 0;
  background-image: linear-gradient(transparent 31px, var(--pauta) 32px); background-size: 100% 32px;
  padding: 20px 22px 20px 54px;
}
.folha::before { content: ""; position: absolute; left: 38px; top: 0; bottom: 0; width: 2px; background: var(--margem); }
.folha h2 { font-family: var(--f-display); font-weight: 700; font-size: 28px; margin: 0 0 4px; line-height: 1.15; text-wrap: balance; }
.folha .sub { color: var(--tinta-suave); margin: 0 0 14px; }
.folha p { margin: 0 0 12px; }
.linha-botoes { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.btn { background: var(--sol); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 10px; padding: 10px 18px; font-family: var(--f-display); font-weight: 700; font-size: 17px; box-shadow: 0 3px 0 var(--tinta); }
.btn.sec { background: var(--papel); }
.btn.ok { background: var(--ok); color: #fff; }
.btn.nao { background: var(--nao); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--tinta); }

/* capa */
.capa { background: var(--quadro); color: var(--giz); background-image: none; padding: 26px 26px 22px; border: 8px solid #8a6a3f; }
.capa::before { display: none; }
.capa .selo { display: inline-block; font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--quadro); background: var(--sol); border-radius: 6px; padding: 2px 8px; }
.capa h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 7vw, 54px); line-height: 1; margin: 12px 0 10px; text-wrap: balance; }
.capa h1 em { font-style: normal; color: var(--sol); }
.capa p { color: #dfe9e2; max-width: 60ch; }
.capa .controles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin: 16px 0 4px; }
.capa .controles div { border: 2px dashed rgba(245,242,230,.5); border-radius: 10px; padding: 8px 12px; font-size: 15px; }
.capa .controles b { font-family: var(--f-display); color: var(--sol); display: block; }

/* caderno */
.pistas { display: grid; gap: 0; }
.pista { padding: 0 0 32px; position: relative; min-height: 64px; }
.pista h3 { font-family: var(--f-display); font-size: 19px; margin: 0; line-height: 32px; }
.pista p { margin: 0; line-height: 32px; }
.pista.falta { color: #8b93a6; }
.pista .n { position: absolute; left: -40px; top: 0; width: 28px; text-align: center; font-family: var(--f-display); font-weight: 700; color: var(--margem); line-height: 32px; }

/* chat do grupo */
.chat { background: #e9e3d7; border-radius: 12px; overflow: hidden; border: 2px solid var(--tinta); }
.chat-topo { background: #1f6f5c; color: #fff; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }
.chat-topo .av { width: 34px; height: 34px; border-radius: 50%; background: var(--sol); color: var(--tinta); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; }
.chat-topo b { font-family: var(--f-display); display: block; line-height: 1.1; }
.chat-topo small { opacity: .85; }
.chat-corpo { padding: 14px; display: grid; gap: 10px; min-height: 120px; max-height: 42vh; overflow-y: auto; }
.bolha { background: #fff; border-radius: 4px 12px 12px 12px; padding: 8px 12px; max-width: 88%; box-shadow: 0 1px 0 rgba(0,0,0,.12); justify-self: start; min-width: 0; }
.bolha .autor { font-family: var(--f-display); font-weight: 600; font-size: 14px; }
.bolha .txt { font-size: 17px; overflow-wrap: anywhere; }
.bolha .meta { font-size: 12px; color: #8a8f99; text-align: right; }
.etq { display: inline-block; font-size: 13px; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-top: 4px; color: #fff; }
.etq.ajuda { background: var(--ok); }
.etq.machuca { background: var(--nao); }
.etq.certo { background: var(--tinta); }
.chat-botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; background: #fff; border-top: 2px solid var(--tinta); }
.chat-botoes .btn { width: 100%; }

/* linha do tempo */
.colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 620px) { .colunas { grid-template-columns: 1fr; } }
.cartoes { display: grid; gap: 8px; align-content: start; min-width: 0; }
.cartao { text-align: left; background: #fff3c9; border: 2px solid var(--tinta); border-radius: 8px; padding: 8px 12px; font-size: 15px; box-shadow: 0 3px 0 var(--tinta); transform: rotate(-.6deg); }
.cartao:nth-child(even) { transform: rotate(.7deg); background: #d9ecff; }
.trilha { border: 2px dashed var(--tinta-suave); border-radius: 10px; padding: 10px; display: grid; gap: 6px; align-content: start; min-height: 120px; background: rgba(255,255,255,.6); min-width: 0; }
.trilha .item { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: start; font-size: 15px; }
.trilha .item b { background: var(--tinta); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; font-family: var(--f-display); font-size: 14px; }
.trilha .item.certo b { background: var(--ok); }
.trilha .vazio { color: var(--tinta-suave); font-style: italic; }
.rotulo { font-family: var(--f-display); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; color: var(--tinta-suave); margin: 0 0 6px; }

/* quiz */
.opcoes { display: grid; gap: 10px; }
.opcao { text-align: left; background: #fff; border: 2px solid var(--tinta); border-radius: 10px; padding: 12px 14px; font-size: 16px; box-shadow: 0 3px 0 var(--tinta); }
.opcao.certa { background: #d8f2e3; border-color: var(--ok); }
.opcao.errada { background: #fbe0e0; border-color: var(--nao); }
.explica { border-left: 4px solid var(--sol); background: #fff8dd; padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 12px; }
.progresso { display: flex; gap: 6px; margin-bottom: 10px; }
.progresso i { flex: 1; height: 8px; border-radius: 4px; background: #e2e5ec; }
.progresso i.feito { background: var(--sol-escuro); }

/* certificado */
.certificado { text-align: center; border: 4px double var(--tinta); border-radius: 12px; padding: 18px 14px; background: #fff; margin: 6px 0 12px; }
.certificado .t { font-family: var(--f-display); font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); }
.certificado .nome { font-family: var(--f-display); font-weight: 700; font-size: 30px; border-bottom: 2px solid var(--tinta); display: inline-block; min-width: 60%; padding: 0 10px; margin: 6px 0; overflow-wrap: anywhere; }
.certificado input { font: inherit; font-size: 16px; padding: 8px 10px; border: 2px solid var(--tinta); border-radius: 8px; width: min(320px, 100%); margin-top: 8px; }
.ajuda-box { background: var(--quadro); color: var(--giz); border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
.ajuda-box b { color: var(--sol); font-family: var(--f-display); }
@media (max-width: 520px) {
  body { font-size: 16px; }
  .folha { padding: 16px 14px 16px 44px; }
  .folha::before { left: 30px; }
  .pista .n { left: -36px; }
  .dialogo .fala { font-size: 17px; }
  .objetivo { max-width: 100%; }
  .topo { flex-direction: column; }
}
@media (max-width: 520px) { .avisos { top: calc(env(safe-area-inset-top, 0px) + 132px); } }
@media (prefers-reduced-motion: reduce) { .aviso { animation: none; } }
</style>
</head><body>

<canvas id="jogo" aria-label="Mapa da escola"></canvas>

<div class="topo">
  <div class="objetivo" id="objetivo"><small>Próximo passo</small><span id="objetivoTexto">Comece a investigação</span></div>
  <div class="acoes-topo">
    <button class="btn-topo" id="btnCaderno" type="button">Caderno <span class="num" id="contPistas">0/7</span></button>
    <button class="btn-topo" id="btnSom" type="button" aria-pressed="true">Som: ligado</button>
    <button class="btn-topo" id="btnMenu" type="button">Menu</button>
  </div>
</div>

<div class="avisos" id="avisos" aria-live="polite"></div>
<button class="interagir" id="interagir" type="button" hidden><kbd>E</kbd><span id="interagirTexto">Conversar</span></button>
<div class="joy" id="joy" hidden><i id="joyBola"></i></div>
<div class="dica-toque" id="dicaToque" hidden>Arraste o dedo na tela para andar</div>

<div class="dialogo" id="dialogo" hidden role="dialog" aria-live="polite">
  <div class="quem" id="dlgQuem"></div>
  <div class="fala" id="dlgFala"></div>
  <div class="escolhas" id="dlgEscolhas"></div>
  <div class="seguir"><button class="btn-giz" id="dlgSeguir" type="button">Continuar ▸</button></div>
</div>

<div id="modais"></div>

<script>
(() => {
"use strict";

/* ===================================================================
   HISTÓRIA (mesmo conteúdo do CaseData do Roblox)
   =================================================================== */
const HIST = {
  intro: [
    "Na semana passada, uma montagem com a foto da Ana, aluna do 8º ano B, circulou no grupo da turma.",
    "Ela ficou tão constrangida que parou de vir à escola.",
    "Você faz parte da equipe Escola Conectada Sem Bullying. Sua missão é descobrir o que aconteceu, entender como a imagem se espalhou e ajudar a resolver o caso com respeito."
  ],
  obrigatorias: ["RelatoAna","PrintGrupo","BilheteAmassado","RegistroLab","Encaminhamentos","ArrependimentoLucas","LinhaDoTempo"],
  pistas: {
    RelatoAna: { nome: "Relato da Ana", desc: "Ana escorregou na quadra durante a aula de Educação Física. Alguém tirou uma foto e fez uma montagem com a frase 'A QUEDA DO ANO', que foi postada no grupo da turma." },
    PrintGrupo: { nome: "Print do grupo '8º B Oficial'", desc: "A montagem foi publicada primeiro por um perfil anônimo chamado 'zoeira_8B', na terça-feira às 10h25." },
    BilheteAmassado: { nome: "Rascunho amassado", desc: "Papel encontrado na lixeira do laboratório: 'A QUEDA DO ANO - perfil zoeira_8B'. No canto, as iniciais L.M.",
      requer: ["PrintGrupo"], bloqueado: "Um papel amassado na lixeira. Você ainda não sabe se isso é importante. Converse com mais pessoas primeiro." },
    RegistroLab: { nome: "Registro do laboratório", desc: "Folha de uso dos computadores: Lucas M. usou o computador 07 na terça, das 10h10 às 10h40. A montagem foi postada às 10h25.",
      requer: ["PrintGrupo"], bloqueado: "Uma folha com nomes e horários. Sem saber quando a montagem foi postada, ela não diz muita coisa." },
    Encaminhamentos: { nome: "Análise das mensagens", desc: "Rafa encaminhou a montagem para outros 5 grupos. Muitos riram, mas quatro colegas pediram para parar e a Bia guardou as provas para avisar um adulto." },
    ArrependimentoLucas: { nome: "Conversa com o Lucas", desc: "Lucas admitiu ter criado a montagem e o perfil 'zoeira_8B'. Ao perceber o sofrimento da Ana, decidiu apagar o conteúdo e pedir desculpas." },
    LinhaDoTempo: { nome: "Linha do tempo do caso", desc: "Queda na quadra → foto → montagem no laboratório → postagem pelo perfil anônimo → compartilhamento em massa → Ana deixa de ir à escola → Bia leva o print à coordenação." }
  },
  npcs: {
    Ana: { nome: "Ana", papel: "Aluna do 8º B", dialogos: [
      { requer: ["RelatoAna","ArrependimentoLucas"], falas: ["O Lucas veio falar comigo e pediu desculpas. Ainda dói um pouco, mas me senti melhor.", "Obrigada por não desistir de mim."] },
      { requer: ["RelatoAna"], falas: ["Obrigada por me ouvir. Ainda tenho vergonha de voltar pra sala...", "A Bia, minha amiga, viu tudo no grupo. Talvez ela possa te ajudar. Ela fica no pátio."] },
      { requer: [], concede: "RelatoAna", falas: ["...", "(Ana olha para o chão e parece não querer conversar.)"], escolhas: [
        { texto: "Ei, você é a menina da foto, né? Kkkk", correta: false, resposta: ["(Ana se vira e vai embora, com os olhos cheios de lágrimas.)", "Pense: como você se sentiria se falassem assim com você? Tente de novo, com mais empatia."] },
        { texto: "Oi, Ana. Você não precisa falar se não quiser, mas estou aqui para ajudar. Posso sentar com você?", correta: true, resposta: ["...Tá bom.", "Na aula de Educação Física eu escorreguei na quadra. Alguém tirou uma foto bem na hora.", "Depois fizeram uma montagem com a frase 'A QUEDA DO ANO' e colocaram no grupo da turma.", "Todo mundo ficou rindo, mandando figurinha... Eu não tive coragem de voltar."] },
        { texto: "Isso é bobagem, esquece e volta pra aula.", correta: false, resposta: ["Não é bobagem pra mim...", "(Diminuir o sofrimento de alguém faz a pessoa se sentir ainda mais sozinha. Tente de novo.)"] }
      ] }
    ] },
    Bia: { nome: "Bia", papel: "Amiga da Ana", dialogos: [
      { requer: ["PrintGrupo"], falas: ["Já te mostrei o print. Por favor, descobre quem fez isso!", "Ah, a Dona Célia, a inspetora, comentou que achou umas coisas estranhas no laboratório de informática."] },
      { requer: ["RelatoAna"], concede: "PrintGrupo", falas: ["A Ana te contou? Que bom que ela confiou em você.", "Eu tirei um print do grupo antes que apagassem. Guardei pra mostrar a um adulto.", "Olha aqui: quem postou primeiro foi um perfil chamado 'zoeira_8B', sem foto. Ninguém sabe quem é.", "Guardar as provas e contar para um adulto de confiança é o certo a fazer."] },
      { requer: [], falas: ["Desculpa, agora não dá. Tô preocupada com a minha amiga Ana.", "Se você quer mesmo ajudar, fala com ela primeiro... mas com cuidado. Ela está sozinha perto do muro."] }
    ] },
    DonaCelia: { nome: "Dona Célia", papel: "Inspetora", dialogos: [
      { requer: ["PrintGrupo"], falas: ["Então era isso que estava acontecendo! Na terça eu vi um papel amassado na lixeira do laboratório de informática.", "Deixei lá mesmo. E tem a folha de registro de quem usa os computadores, fica em cima da mesa do professor, no laboratório."] },
      { requer: [], falas: ["Bom dia! Os corredores andam agitados essa semana... muita gente cochichando e olhando o celular.", "Se descobrir alguma coisa, me conta."] }
    ] },

function sala(r) {
  const vao = 92;
  pisos.push({ x: r.x, y: r.y, w: r.w, h: r.h, tipo: r.piso });
  parede(r.x, r.y, r.w, T, "janela");
  parede(r.x, r.y, T, r.h);
  if (r.porta === "S") {
    const cx = r.x + r.w / 2;
    parede(r.x, r.y + r.h - T, cx - vao / 2 - r.x, T);
    parede(cx + vao / 2, r.y + r.h - T, r.x + r.w - (cx + vao / 2), T);
    parede(r.x + r.w - T, r.y, T, r.h);
    placas.push({ x: cx, y: r.y + r.h + 14, texto: r.nome });
  } else {
    const cy = r.y + r.h / 2;
    parede(r.x, r.y + r.h - T, r.w, T);
    parede(r.x + r.w - T, r.y, T, cy - vao / 2 - r.y);
    parede(r.x + r.w - T, cy + vao / 2, T, r.y + r.h - (cy + vao / 2));
    placas.push({ x: r.x + r.w + 62, y: cy - 58, texto: r.nome });
  }
}

// personagem visto de frente (estilo "chibi"); x,y = pés
function desenharPessoa(p, t, dir, andando) {
  const esc = p.adulto ? 1.12 : 1;
  const bob = andando ? Math.abs(Math.sin(t * 10)) * 2 : Math.sin(t * 2 + (p.x || 0)) * 0.8;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(esc, esc);
  ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(0, 0, 12, 5, 0, 0, 7); ctx.fill();
  ctx.translate(0, -bob);
  const costas = dir === "cima";
  const lado = dir === "esq" ? -1 : dir === "dir" ? 1 : 0;
  // pernas
  const pern = andando ? Math.sin(t * 12) * 3 : 0;
  ctx.fillStyle = p.calca; rr(-7, -12 + pern * 0.3, 6, 12, 2); ctx.fill(); rr(1, -12 - pern * 0.3, 6, 12, 2); ctx.fill();
  // mochila (de costas aparece inteira)
  if (p.mochila && costas) { ctx.fillStyle = p.mochila; rr(-9, -30, 18, 16, 4); ctx.fill(); }
  // corpo
  ctx.fillStyle = p.camisa; rr(-10, -30, 20, 20, 6); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.stroke();
  // braços
  ctx.fillStyle = p.adulto ? p.camisa : p.pele;
  rr(-14, -28, 5, 14, 2.5); ctx.fill(); rr(9, -28, 5, 14, 2.5); ctx.fill();
  ctx.fillStyle = p.pele; ctx.beginPath(); ctx.arc(-11.5, -13, 2.6, 0, 7); ctx.arc(11.5, -13, 2.6, 0, 7); ctx.fill();
  if (p.mochila && !costas) { ctx.fillStyle = p.mochila; ctx.fillRect(-8, -30, 3, 14); ctx.fillRect(5, -30, 3, 14); }
  if (p.gravata && !costas) { ctx.fillStyle = p.gravata; ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(3, -18); ctx.lineTo(0, -15); ctx.lineTo(-3, -18); ctx.closePath(); ctx.fill(); }
  if (p.cracha && !costas) { ctx.fillStyle = "#fff"; ctx.fillRect(2, -24, 6, 7); ctx.fillStyle = "#2f63b5"; ctx.fillRect(2, -24, 6, 2); }
  // cabeça
  const cy = -41;
  const cab = p.corCabelo;
  if (p.cabelo === "longo") { ctx.fillStyle = cab; rr(-12, cy - 6, 24, 24, 8); ctx.fill(); }
  if (p.cabelo === "rabo" && !costas) { ctx.fillStyle = cab; ctx.beginPath(); ctx.ellipse(lado >= 0 ? -12 : 12, cy + 4, 4, 9, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = p.pele; ctx.beginPath(); ctx.arc(0, cy, 11, 0, 7); ctx.fill();
  // cabelo por cima
  ctx.fillStyle = cab;
  if (costas) {
    ctx.beginPath(); ctx.arc(0, cy, 11.5, 0, 7); ctx.fill();
    if (p.cabelo === "rabo") { ctx.beginPath(); ctx.ellipse(0, cy + 10, 4, 8, 0, 0, 7); ctx.fill(); }
  } else {
    ctx.beginPath(); ctx.arc(0, cy - 2, 11.6, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
    ctx.fillRect(-11.5, cy - 4, 23, 3);
  }
  if (p.cabelo === "coque") { ctx.beginPath(); ctx.arc(0, cy - 13, 5.5, 0, 7); ctx.fill(); }
  if (p.cabelo === "espetado") { for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 6 - 4, cy - 9); ctx.lineTo(i * 6, cy - 17); ctx.lineTo(i * 6 + 4, cy - 9); ctx.fill(); } }
  // rosto
  if (!costas) {
    const ox = lado * 3;
    ctx.fillStyle = "#1d1d26";
    if (p.triste) {
      ctx.strokeStyle = "#1d1d26"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ox - 6, cy + 2); ctx.lineTo(ox - 2, cy + 3); ctx.moveTo(ox + 2, cy + 3); ctx.lineTo(ox + 6, cy + 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(ox, cy + 9, 3, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      ctx.fillStyle = "#7fc4ff"; ctx.beginPath(); ctx.arc(ox - 5, cy + 6, 1.6, 0, 7); ctx.fill();
      ctx.lineWidth = 1;
    } else {
      ctx.beginPath(); ctx.arc(ox - 4, cy + 1, 1.8, 0, 7); ctx.arc(ox + 4, cy + 1, 1.8, 0, 7); ctx.fill();
      ctx.strokeStyle = "#1d1d26"; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(ox, cy + 4, 3, Math.PI * 0.2, Math.PI * 0.8); ctx.stroke(); ctx.lineWidth = 1;
      ctx.fillStyle = "rgba(230,110,110,.35)"; ctx.beginPath(); ctx.arc(ox - 7, cy + 4, 2, 0, 7); ctx.arc(ox + 7, cy + 4, 2, 0, 7); ctx.fill();
    }
    if (p.oculos) {
      ctx.strokeStyle = "#1d1d26"; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(ox - 4, cy + 1, 3.6, 0, 7); ctx.moveTo(ox + 7.6, cy + 1); ctx.arc(ox + 4, cy + 1, 3.6, 0, 7); ctx.moveTo(ox - 0.4, cy + 1); ctx.lineTo(ox + 0.4, cy + 1); ctx.stroke(); ctx.lineWidth = 1;
    }
  }
  ctx.restore();
  if (p.bola) { ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x + 18, p.y - 4, 6, 0, 7); ctx.fill(); ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(p.x + 18, p.y - 4, 2.2, 0, 7); ctx.fill(); }
}

/* som simples */
let somLigado = true, audio = null;
function tom(freqs, dur) {
  if (!somLigado) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle"; o.frequency.value = f;
      const t0 = audio.currentTime + i * dur;
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    });
  } catch (e) {}
}
$("btnSom").addEventListener("click", () => {
  somLigado = !somLigado;
  $("btnSom").textContent = "Som: " + (somLigado ? "ligado" : "desligado");
  $("btnSom").setAttribute("aria-pressed", String(somLigado));
});

function concederPista(id) {
  if (!id || tem(id)) return;
  estado.pistas.add(id); salvar(); atualizarHud();
  aviso("Nova pista: " + HIST.pistas[id].nome, "pista");
  tom([660, 880, 1175], 0.12);
  if (HIST.obrigatorias.every(tem)) setTimeout(() => aviso("Todas as pistas reunidas! Procure a Coord. Helena."), 900);
}

/* diálogo com efeito de máquina de escrever */
let escrevendo = false, pular = false, resolverAvanco = null;
function escrever(texto) {
  return new Promise(res => {
    const el = $("dlgFala"); const letras = [...texto]; let i = 0;
    escrevendo = true; pular = false; el.textContent = "";
    const passo = () => {
      if (pular || i >= letras.length) { el.textContent = texto; escrevendo = false; res(); return; }
      i++; el.textContent = letras.slice(0, i).join(""); setTimeout(passo, 16);
    };
    passo();
  });
}
function avancar() {
  if ($("dialogo").hidden) return;
  if (escrevendo) { pular = true; return; }
  if (resolverAvanco) { const r = resolverAvanco; resolverAvanco = null; r(); }
}
$("dlgSeguir").addEventListener("click", e => { e.stopPropagation(); avancar(); });
$("dialogo").addEventListener("click", e => { if (!e.target.closest(".escolha")) avancar(); });

async function falar(nome, papel, falas, escolhas) {
  ui.trava++;
  const caixa = $("dialogo");
  $("dlgQuem").innerHTML = "";
  $("dlgQuem").append(nome);
  if (papel) { const s = document.createElement("small"); s.textContent = papel; $("dlgQuem").append(s); }
  $("dlgEscolhas").innerHTML = "";
  caixa.hidden = false;
  for (let i = 0; i < falas.length; i++) {
    $("dlgSeguir").hidden = false;
    await escrever(falas[i]);
    if (i === falas.length - 1 && escolhas) break;
    $("dlgSeguir").focus({ preventScroll: true });
    await new Promise(r => { resolverAvanco = r; });
  }
  let escolhida = null;
  if (escolhas) {
    $("dlgSeguir").hidden = true;
    escolhida = await new Promise(res => {
      escolhas.forEach((t, i) => {

const teclas = new Set();
const ehToque = window.matchMedia("(pointer: coarse)").matches;
if (ehToque) { document.body.classList.add("toque"); $("dicaToque").hidden = false; }

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (e.target.tagName === "INPUT") return;
  if (!$("dialogo").hidden && (k === "e" || k === " " || k === "enter")) {
    if (!document.activeElement || !document.activeElement.classList.contains("escolha")) { e.preventDefault(); avancar(); }
    return;
  }
  if (ui.modal) { if (k === "escape") { const fundos = $("modais").children; const ultimoFundo = fundos[fundos.length - 1]; const b = ultimoFundo && ultimoFundo.querySelector("[data-fechar]"); if (b) b.click(); } return; }
  if (["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].includes(k)) { teclas.add(k); e.preventDefault(); }
  if ((k === "e" || k === " " || k === "enter") && alvoAtual && podeAndar()) { e.preventDefault(); interagir(); }
  if (k === "c" && podeAndar()) abrirCaderno();

window.addEventListener("keyup", e => teclas.delete(e.key.toLowerCase()));

// joystick por toque/arrasto
const joy = { ativo: false, id: null, cx: 0, cy: 0, dx: 0, dy: 0 };
cv.addEventListener("pointerdown", e => {
  if (!$("dialogo").hidden) { avancar(); return; }
  if (!podeAndar()) return;
  joy.ativo = true; joy.id = e.pointerId; joy.cx = e.clientX; joy.cy = e.clientY; joy.dx = joy.dy = 0;
  cv.setPointerCapture(e.pointerId);
  const j = $("joy"); j.style.left = e.clientX + "px"; j.style.top = e.clientY + "px"; j.hidden = false; $("joyBola").style.transform = "";
  $("dicaToque").hidden = true;
});
cv.addEventListener("pointermove", e => {
  if (!joy.ativo || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.cx, dy = e.clientY - joy.cy;
  const d = Math.hypot(dx, dy), max = 45;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  joy.dx = dx / max; joy.dy = dy / max;
  $("joyBola").style.transform = `translate(${dx}px, ${dy}px)`;
});
const soltar = e => { if (e.pointerId !== joy.id) return; joy.ativo = false; joy.dx = joy.dy = 0; $("joy").hidden = true; };
cv.addEventListener("pointerup", soltar); cv.addEventListener("pointercancel", soltar);

let alvoAtual = null;
function interagir() {
  const a = alvoAtual; if (!a) return;
  $("interagir").hidden = true;
  if (a.npc) conversar(a.npc.id); else examinar(a.obj);

function colide(x, y) {
  const r = { x: x - 8, y: y - 6, w: 16, h: 8 };
  return solidos.some(s => r.x < s.x + s.w && r.x + r.w > s.x && r.y < s.y + s.h && r.y + r.h > s.y);
}

function atualizar(dt) {
  let vx = 0, vy = 0;
  if (podeAndar()) {
    if (teclas.has("arrowleft") || teclas.has("a")) vx -= 1;
    if (teclas.has("arrowright") || teclas.has("d")) vx += 1;
    if (teclas.has("arrowup") || teclas.has("w")) vy -= 1;
    if (teclas.has("arrowdown") || teclas.has("s")) vy += 1;
    if (joy.ativo) { vx += joy.dx; vy += joy.dy; }
  }
  const mag = Math.hypot(vx, vy);
  jogador.andando = mag > 0.15;
  if (jogador.andando) {
    if (mag > 1) { vx /= mag; vy /= mag; }
    const vel = 170 * dt;
    const nx = jogador.x + vx * vel, ny = jogador.y + vy * vel;
    if (!colide(nx, jogador.y)) jogador.x = nx;
    if (!colide(jogador.x, ny)) jogador.y = ny;
    jogador.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "esq" : "dir") : (vy < 0 ? "cima" : "baixo");
  }
  // alvo de interação mais próximo
  let melhor = null, dmin = 70;
  for (const n of NPCS) { const d = Math.hypot(n.x - jogador.x, n.y - jogador.y); if (d < dmin) { dmin = d; melhor = { npc: n }; } }
  for (const o of OBJETOS) { const d = Math.hypot(o.x - jogador.x, o.y - jogador.y); if (d < dmin) { dmin = d; melhor = { obj: o }; } }
  alvoAtual = melhor;
  const btn = $("interagir");
  if (melhor && podeAndar()) {
    $("interagirTexto").textContent = melhor.npc ? "Conversar com " + HIST.npcs[melhor.npc.id].nome : melhor.obj.rotulo;
    btn.hidden = false;
  } else btn.hidden = true;
}

function desenhar(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#6fa552"; ctx.fillRect(0, 0, larg, alt);
  // câmera
  const vw = larg / zoom, vh = alt / zoom;
  let camX = jogador.x - vw / 2, camY = jogador.y - vh / 2 - 20;
  camX = vw >= MUNDO.w ? (MUNDO.w - vw) / 2 : Math.max(-20, Math.min(MUNDO.w - vw + 20, camX));
  camY = vh >= MUNDO.h ? (MUNDO.h - vh) / 2 : Math.max(-20, Math.min(MUNDO.h - vh + 20, camY));
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, -camX * dpr * zoom, -camY * dpr * zoom);

  desenharPisos();
  desenharMoveis(t);
  desenharParedes();
  for (const o of OBJETOS) desenharObjeto(o, t);

  // entidades ordenadas por profundidade
  const lista = [];
  NPCS.forEach(n => lista.push({ y: n.y, f: () => desenharPessoa(n, t, n.olhar, false) }));
  altos.forEach(a => lista.push({ y: a.y, f: () => desenharArvore(a) }));
  lista.push({ y: jogador.y, f: () => desenharPessoa(Object.assign({ x: jogador.x, y: jogador.y }, JOGADOR_VISUAL), t, jogador.dir, jogador.andando) });
  lista.sort((a, b) => a.y - b.y).forEach(e => e.f());

  // nomes e marcadores
  NPCS.forEach(n => {
    const topo = n.y - (n.adulto ? 64 : 58);
    desenharNome(HIST.npcs[n.id].nome, n.x, topo);
    if (!estado.concluido && temNovidade(n.id)) desenharMarcador(n.x, topo - 22, t, "!");
  });
  OBJETOS.forEach(o => { if (objetoDisponivel(o)) desenharMarcador(o.x, o.y - 62, t, "?"); });
  if (alvoAtual) {
    const a = alvoAtual.npc || alvoAtual.obj;
    ctx.strokeStyle = "rgba(255,201,60,.9)"; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.ellipse(a.x, a.y, 20, 8, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
  }
}

let ultimo = performance.now();
function quadro(agora) {
  const dt = Math.min(0.05, (agora - ultimo) / 1000); ultimo = agora;
  atualizar(dt); desenhar(agora / 1000);
  requestAnimationFrame(quadro);
}

/* ===================================================================
   INÍCIO
   =================================================================== */
function iniciar(dados) {
  const salvo = (dados && Array.isArray(dados.pistas)) ? dados : carregarSalvo();
  if (salvo) { salvo.pistas.forEach(id => HIST.pistas[id] && estado.pistas.add(id)); estado.concluido = !!salvo.concluido; }
  if (dados && typeof dados.x === "number") { jogador.x = dados.x; jogador.y = dados.y; }
  atualizarHud();
  requestAnimationFrame(quadro);
  if (!dados || typeof dados.x !== "number") abrirCapa();
}
try { window.claude?.hot?.snapshot?.(() => ({ pistas: [...estado.pistas], concluido: estado.concluido, x: jogador.x, y: jogador.y })); } catch (e) {}
const comecar = () => { const h = window.claude?.hot; if (h?.ready) h.ready(iniciar); else iniciar(h?.data); };
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(comecar, comecar);
})();
</script>
